<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>STACK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Layout: one fullscreen canvas; HUD floats on top — score top-center, controls bottom-center */
:root {
  --bg: #07080c;
  --ink: #f5f6fb;
  --dim: rgba(245, 246, 251, .58);
  --faint: rgba(245, 246, 251, .12);
  --line: rgba(245, 246, 251, .22);
  --gold: #ffd166;
  --display: "Unbounded", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); }
body {
  font-family: var(--body);
  touch-action: none; overscroll-behavior: none;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.layer {
  position: fixed; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: calc(env(safe-area-inset-top, 0px) + 28px) 16px calc(env(safe-area-inset-bottom, 0px) + 40px);
  box-sizing: border-box;
}
.fade { opacity: 0; visibility: hidden; transition: opacity .22s ease, visibility 0s linear .22s; }
body[data-state="ready"] #start,
body[data-state="over"] #over,
body:not([data-state="ready"]) #hud { opacity: 1; visibility: visible; transition: opacity .22s ease; }

/* HUD */
#hud { justify-content: flex-start; gap: 10px; }
.score {
  font: 800 clamp(64px, 19vw, 124px)/1 var(--display);
  letter-spacing: -.03em; font-variant-numeric: tabular-nums;
  text-shadow: 0 6px 40px rgba(0, 0, 0, .35);
}
.unit {
  font: 500 12px/1 var(--display); letter-spacing: .32em; text-transform: uppercase; color: var(--dim);
  opacity: 0; transition: opacity .2s;
}
body[data-state="over"] .unit { opacity: 1; }
.combo {
  font: 700 12px/1 var(--display); letter-spacing: .2em;
  padding: 8px 13px 7px; border-radius: 999px;
  background: var(--faint); color: var(--ink);
  opacity: 0; transform: translateY(-4px); transition: opacity .18s, transform .18s;
}
.combo.on { opacity: 1; transform: none; }
body[data-state="over"] .combo { opacity: 0; }

/* Start */
#start { justify-content: space-between; }
.title {
  margin: 0; font: 800 clamp(58px, 18vw, 120px)/1 var(--display); letter-spacing: .04em;
  background: linear-gradient(90deg, #ff6b8b, #ffb347, #ffe066, #6ee7a8, #5cc8ff, #a78bfa);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.tagline { margin: 12px 0 0; font: 500 14px/1.5 var(--body); color: var(--dim); text-wrap: balance; max-width: 30ch; }

/* Shared bottom group */
.group { display: flex; flex-direction: column; align-items: center; gap: 14px; }
#over { justify-content: flex-end; }
.tap {
  font: 700 clamp(17px, 4.6vw, 22px)/1 var(--display); letter-spacing: .06em;
  animation: pulse 1.3s ease-in-out infinite;
}
.meta { font: 500 12px/1 var(--display); letter-spacing: .26em; text-transform: uppercase; color: var(--dim); }
.meta b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.keys { font: 500 12px/1 var(--body); color: var(--dim); }
.record {
  font: 800 clamp(20px, 6vw, 28px)/1 var(--display); letter-spacing: .06em; color: var(--gold);
  text-shadow: 0 0 24px rgba(255, 209, 102, .45);
  animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both;
}
button {
  pointer-events: auto; cursor: pointer; color: var(--ink);
  font: 700 13px/1 var(--display); letter-spacing: .12em; text-transform: uppercase;
  background: var(--faint); border: 1px solid var(--line); border-radius: 999px;
  padding: 14px 22px; transition: background .15s, transform .1s;
}
button:hover { background: rgba(245, 246, 251, .2); }
button:active { transform: scale(.96); }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.share { margin-top: 6px; display: inline-flex; align-items: center; gap: 10px; }
.share svg { width: 16px; height: 16px; }
#mute {
  position: fixed; z-index: 2;
  top: calc(env(safe-area-inset-top, 0px) + 14px); right: 14px;
  width: 42px; height: 42px; padding: 0; display: grid; place-items: center;
  background: transparent; border-color: transparent; color: var(--dim);
}
#mute:hover { background: var(--faint); color: var(--ink); }
#mute svg { width: 22px; height: 22px; }

@keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .4 } }
@keyframes pop { from { transform: scale(.4); opacity: 0 } to { transform: scale(1); opacity: 1 } }
@media (prefers-reduced-motion: reduce) {
  .tap, .record { animation: none; }
}
</style>
</head>
<body data-state="ready">

<canvas id="c" aria-label="STACK game"></canvas>

<div id="hud" class="layer fade" aria-live="polite">
  <div id="score" class="score">0</div>
  <div class="unit">blocks</div>
  <div id="combo" class="combo">×2 COMBO</div>
</div>

<div id="start" class="layer fade">
  <div>
    <h1 class="title">STACK</h1>
    <p class="tagline">Drop each block on the one below. Whatever hangs over gets cut.</p>
  </div>
  <div class="group">
    <div class="tap">Tap to start</div>
    <div class="keys">Tap, click or press Space</div>
    <div class="meta">Best <b id="startBest">0</b></div>
  </div>
</div>

<div id="over" class="layer fade">
  <div class="group">
    <div id="record" class="record" hidden>NEW RECORD!</div>
    <div class="meta">Best <b id="best">0</b></div>
    <div class="tap">Tap to restart</div>
    <button id="share" class="share" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      <span id="shareLabel">Share</span>
    </button>
  </div>
</div>

<button id="mute" type="button" aria-label="Mute sound">
  <svg id="icoOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <svg id="icoOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/><path d="m16 9 6 6M22 9l-6 6"/></svg>
</button>

<script>
(() => {
  'use strict';

  // ---------- DOM ----------
  const $ = (id) => document.getElementById(id);
  const cvs = $('c');
  const ctx = cvs.getContext('2d', { alpha: false });
  const scoreEl = $('score'), comboEl = $('combo'), recordEl = $('record');
  const bestEl = $('best'), startBestEl = $('startBest');
  const shareBtn = $('share'), shareLabel = $('shareLabel'), muteBtn = $('mute');

  // ---------- Storage (never trusted to exist) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let best = parseInt(store.get('stack.best', '0'), 10) || 0;
  let muted = store.get('stack.muted', '0') === '1';
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  startBestEl.textContent = best;

  // ---------- Canvas sizing ----------
  let W = 0, H = 0, DPR = 1;
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  }
  addEventListener('resize', resize);
  resize();

  // ---------- Audio (Web Audio, synthesized) ----------
  const audio = (() => {
    let ac = null, master = null, noiseBuf = null;
    const VOL = 0.55;
    function unlock() {
      if (!ac) {
        try {
          ac = new (window.AudioContext || window.webkitAudioContext)();
          master = ac.createGain();
          master.gain.value = muted ? 0 : VOL;
          master.connect(ac.destination);
          noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.6), ac.sampleRate);
          const d = noiseBuf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        } catch (e) { ac = null; }
      }
      if (ac && ac.state === 'suspended') ac.resume();
    }
    function tone(type, f0, f1, dur, vol, delay = 0) {
      const t = ac.currentTime + delay;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t);
      if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + dur + 0.03);
    }
    function noise(dur, vol, freq, delay = 0) {
      const t = ac.currentTime + delay;
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(master);
      s.start(t); s.stop(t + dur + 0.03);
    }
    const PENTA = [0, 2, 4, 7, 9];
    return {
      unlock,
      setMuted(m) { if (ac) master.gain.setTargetAtTime(m ? 0 : VOL, ac.currentTime, 0.02); },
      drop(frac) {           // frac = how much of the block survived (0..1)
        if (!ac) return;
        const f = 120 + 90 * frac;
        tone('triangle', f * 1.8, f * 0.6, 0.13, 0.4);
        noise(0.05, 0.22, 2400);
      },
      perfect(combo) {       // rising major-pentatonic ladder
        if (!ac) return;
        const i = Math.min(combo - 1, 14);
        const semi = 12 * Math.floor(i / 5) + PENTA[i % 5];
        const f = 392 * Math.pow(2, semi / 12);
        tone('sine', f, f, 0.5, 0.34);
        tone('triangle', f * 2, f * 2, 0.22, 0.07);
        tone('sine', f * 1.5, f * 1.5, 0.35, 0.12, 0.07);
        noise(0.04, 0.12, 5000);
      },
      over() {
        if (!ac) return;
        tone('sawtooth', 240, 48, 0.75, 0.1);
        tone('triangle', 160, 40, 0.6, 0.35);
        noise(0.4, 0.35, 700);
      }
    };
  })();

  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  // ---------- Game state ----------
  const TOL = 3;               // px window for a PERFECT drop
  const HUE_STEP = 7;          // hue shift per block
  let BASE_W = 300, BH = 30;
  let state = 'ready';         // ready | playing | dying | over
  let tower = [], slider = null;
  const pieces = [], parts = [], rings = [], texts = [];
  let score = 0, combo = 0, startHue = 200, bgHue = 200;
  let camY = 0, zoom = 1, shake = 0, overAt = 0, screenFlash = 0;

  const hueAt = (level) => startHue + level * HUE_STEP;
  const range = () => Math.min(W * 0.5, BASE_W * 1.2);
  const speed = () => BASE_W * 1.05 * Math.min(2.3, 1 + 0.08 * Math.floor(score / 5));

  function setState(s) { state = s; document.body.dataset.state = s; }

  function reset() {
    BASE_W = Math.round(Math.min(W * 0.62, 330));
    BH = Math.round(Math.max(18, Math.min(34, H / 24)));
    startHue = Math.random() * 360;
    bgHue = startHue;
    tower = [{ x: 0, w: BASE_W, h: startHue, flash: 0 }];
    slider = null;
    pieces.length = parts.length = rings.length = texts.length = 0;
    score = 0; combo = 0; camY = 0; zoom = 1; shake = 0; screenFlash = 0;
    scoreEl.textContent = '0';
    updateCombo();
  }

  function spawnSlider() {
    const top = tower[tower.length - 1];
    const level = tower.length;
    const side = level % 2 ? -1 : 1;
    slider = { x: side * range(), w: top.w, dir: -side, h: hueAt(level), t: performance.now() };
  }

  // Advances the slider to time t; called per frame AND at the exact input timestamp.
  function advanceSlider(t) {
    if (!slider) return;
    let dt = (t - slider.t) / 1000;
    if (dt <= 0) return;
    slider.t = t;
    dt = Math.min(dt, 0.05);
    const A = range();
    slider.x += slider.dir * speed() * dt;
    if (slider.x > A) { slider.x = 2 * A - slider.x; slider.dir = -1; }
    else if (slider.x < -A) { slider.x = -2 * A - slider.x; slider.dir = 1; }
    slider.x = Math.max(-A, Math.min(A, slider.x));
  }

  function addShake(a) { shake = Math.max(shake, a * (reduceMotion ? 0.25 : 1)); }

  function drop() {
    const prev = tower[tower.length - 1];
    const s = slider;
    const d = s.x - prev.x, ad = Math.abs(d);
    const level = tower.length, yb = level * BH;
    const sgn = Math.sign(d) || 1;

    if (ad >= s.w) {                       // complete miss
      pieces.push({ x: s.x, y: yb + BH / 2, w: s.w, vx: sgn * 90, vy: 40, r: 0, vr: sgn * 2.4, h: s.h, age: 0 });
      slider = null;
      gameOver();
      return;
    }

    let nb;
    if (ad <= TOL) {                       // PERFECT
      combo++;
      let w = prev.w;
      if (combo >= 5 && w < BASE_W) w = Math.min(BASE_W, w + BASE_W * 0.05); // long combos earn width back
      nb = { x: prev.x, w, h: s.h, flash: 1 };
      perfectFX(nb, yb);
    } else {                               // slice
      combo = 0;
      const keep = s.w - ad, nx = prev.x + d / 2;
      nb = { x: nx, w: keep, h: s.h, flash: 0.55 };
      pieces.push({
        x: nx + sgn * (keep / 2 + ad / 2), y: yb + BH / 2, w: ad,
        vx: sgn * (50 + Math.random() * 90), vy: 80, r: 0, vr: sgn * (1.6 + Math.random() * 3), h: s.h, age: 0
      });
      addShake(3 + 6 * ad / s.w);
      audio.drop(keep / s.w);
      buzz(8);
    }

    tower.push(nb);
    score++;
    scoreEl.textContent = score;
    if (!reduceMotion) scoreEl.animate([{ transform: 'scale(1.16)' }, { transform: 'scale(1)' }], { duration: 180, easing: 'ease-out' });
    updateCombo();
    spawnSlider();
  }

  function perfectFX(b, yb) {
    rings.push({ x: b.x, w: b.w, y: yb, t: 0 });
    const n = 30;
    for (let i = 0; i < n; i++) {
      const edge = Math.random();
      parts.push({
        x: b.x - b.w / 2 + edge * b.w, y: yb + BH,
        vx: (edge - 0.5) * 260 + (Math.random() - 0.5) * 120,
        vy: 160 + Math.random() * 360,
        life: 0.6 + Math.random() * 0.6, max: 1.2,
        s: 2 + Math.random() * 3.5, h: b.h + (Math.random() - 0.5) * 40
      });
    }
    texts.push({ main: 'PERFECT!', sub: combo > 1 ? '×' + combo : '', x: b.x, y: yb + BH + 14, t: 0, h: b.h });
    addShake(5);
    audio.perfect(combo);
    buzz(14);
  }

  function updateCombo() {
    if (combo >= 2) comboEl.textContent = '×' + combo + ' COMBO';
    comboEl.classList.toggle('on', combo >= 2 && state === 'playing');
  }

  function gameOver() {
    setState('dying');
    combo = 0; updateCombo();
    addShake(22);
    screenFlash = 0.35;
    audio.over();
    buzz([40, 50, 90]);
    const isRecord = score > best;
    if (isRecord) { best = score; store.set('stack.best', String(best)); }
    setTimeout(() => {
      recordEl.hidden = !isRecord;
      bestEl.textContent = best;
      startBestEl.textContent = best;
      shareLabel.textContent = 'Share';
      overAt = performance.now();
      setState('over');
    }, 450);
  }

  function restart() {
    reset();
    setState('playing');
    spawnSlider();
  }

  // ---------- Input ----------
  function input() {
    audio.unlock();
    if (state === 'ready') { reset(); setState('playing'); spawnSlider(); return; }
    if (state === 'playing') { advanceSlider(performance.now()); drop(); return; }
    if (state === 'over' && performance.now() - overAt > 220) restart();
  }

  addEventListener('pointerdown', (e) => {
    if (e.button > 0) return;
    if (e.target.closest && e.target.closest('button')) return;
    e.preventDefault();
    input();
  }, { passive: false });

  addEventListener('keydown', (e) => {
    if (e.code !== 'Space' && e.code !== 'Enter') return;
    if (e.code === 'Enter' && e.target.closest && e.target.closest('button')) return;
    e.preventDefault();
    if (!e.repeat) input();
  });
  addEventListener('contextmenu', (e) => e.preventDefault());

  shareBtn.addEventListener('click', () => {
    const text = 'I stacked ' + score + ' block' + (score === 1 ? '' : 's') + ' in STACK 🧱 Can you beat me? ' + location.href;
    const done = () => { shareLabel.textContent = 'Copied!'; setTimeout(() => { shareLabel.textContent = 'Share'; }, 1600); };
    const fallback = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
        document.body.appendChild(ta); ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        shareLabel.textContent = ok ? 'Copied!' : 'Copy failed';
        setTimeout(() => { shareLabel.textContent = 'Share'; }, 1600);
      } catch (e) { shareLabel.textContent = 'Copy failed'; }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
    shareBtn.blur();
  });

  function paintMute() {
    $('icoOn').hidden = muted; $('icoOff').hidden = !muted;
    muteBtn.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
  }
  muteBtn.addEventListener('click', () => {
    muted = !muted; store.set('stack.muted', muted ? '1' : '0');
    audio.unlock(); audio.setMuted(muted); paintMute(); muteBtn.blur();
  });
  paintMute();

  // ---------- Update ----------
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  const mod = (h) => ((h % 360) + 360) % 360;

  function update(dt) {
    const anchorY = H * 0.72;
    const k = 1 - Math.exp(-dt * 7);

    // Camera: follow the top during play, pull back to show the whole tower on game over
    let tCam, tZoom;
    if (state === 'over') {
      const top = tower.length * BH;
      tZoom = Math.min(1, (H * 0.4) / top);
      tCam = top / 2 - (anchorY - H * 0.44) / tZoom;
      const kz = 1 - Math.exp(-dt * 4);
      zoom += (tZoom - zoom) * kz;
      camY += (tCam - camY) * kz;
    } else {
      tCam = Math.max(0, (tower.length + 1) * BH - (anchorY - H * 0.36));
      zoom += (1 - zoom) * k;
      camY += (tCam - camY) * k;
    }

    bgHue += (hueAt(tower.length) - bgHue) * (1 - Math.exp(-dt * 2));

    shake *= Math.exp(-dt * 11); if (shake < 0.15) shake = 0;
    screenFlash = Math.max(0, screenFlash - dt * 1.6);

    for (let i = Math.max(0, tower.length - 4); i < tower.length; i++) {
      const b = tower[i]; if (b.flash > 0) b.flash = Math.max(0, b.flash - dt * 4.5);
    }

    const G = 2600, floorY = camY - (H / zoom) - 200;
    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      p.age += dt; p.vy -= G * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      if (p.age > 4 || p.y < floorY) pieces.splice(i, 1);
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt; p.vy -= 900 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.exp(-dt * 1.5);
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = rings.length - 1; i >= 0; i--) { rings[i].t += dt * 2.4; if (rings[i].t >= 1) rings.splice(i, 1); }
    for (let i = texts.length - 1; i >= 0; i--) { texts[i].t += dt; if (texts[i].t >= 0.95) texts.splice(i, 1); }
  }

  // ---------- Render ----------
  function blockPath(left, top, w, h, hue, flash) {
    const hh = mod(hue);
    ctx.fillStyle = 'hsl(' + hh + ',68%,58%)';
    ctx.fillRect(left, top, w, h);
    ctx.fillStyle = 'hsl(' + hh + ',80%,72%)';
    ctx.fillRect(left, top, w, Math.max(2, h * 0.16));
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.fillRect(left, top + h * 0.86, w, h * 0.14);
    if (flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.7).toFixed(3) + ')';
      ctx.fillRect(left, top, w, h);
    }
  }

  function render() {
    const anchorY = H * 0.72;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // background
    const bh = mod(bgHue);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'hsl(' + bh + ',36%,13%)');
    g.addColorStop(1, 'hsl(' + mod(bgHue + 40) + ',42%,4%)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const sx = shake ? (Math.random() * 2 - 1) * shake : 0;
    const sy = shake ? (Math.random() * 2 - 1) * shake : 0;
    ctx.translate(W / 2 + sx, anchorY + sy);
    ctx.scale(zoom, zoom);
    ctx.translate(0, camY);
    // From here, world (x, y-up) draws at (x, -y).

    const viewBottom = camY - (H - anchorY) / zoom - BH;
    const viewTop = camY + anchorY / zoom + BH;

    // pedestal under the base block, fading into the background
    if (viewBottom < BH) {
      const base = tower[0];
      const depth = (H - anchorY) / zoom - camY + 60;
      if (depth > 0) {
        const pg = ctx.createLinearGradient(0, 0, 0, depth);
        pg.addColorStop(0, 'hsl(' + mod(base.h) + ',45%,34%)');
        pg.addColorStop(1, 'hsl(' + mod(bgHue + 40) + ',42%,4%)');
        ctx.fillStyle = pg;
        ctx.fillRect(base.x - base.w / 2, 0, base.w, depth);
      }
    }

    // tower
    const i0 = Math.max(0, Math.floor(viewBottom / BH));
    const i1 = Math.min(tower.length - 1, Math.ceil(viewTop / BH));
    for (let i = i0; i <= i1; i++) {
      const b = tower[i];
      blockPath(b.x - b.w / 2, -(i + 1) * BH, b.w, BH, b.h, b.flash);
    }

    // moving block
    if (slider) {
      const L = tower.length;
      blockPath(slider.x - slider.w / 2, -(L + 1) * BH, slider.w, BH, slider.h, 0);
    }

    // falling slices
    for (const p of pieces) {
      ctx.save();
      ctx.translate(p.x, -p.y);
      ctx.rotate(p.r);
      blockPath(-p.w / 2, -BH / 2, p.w, BH, p.h, 0);
      ctx.restore();
    }

    // perfect rings
    for (const r of rings) {
      const e = 3 + easeOut(r.t) * 22;
      ctx.strokeStyle = 'rgba(255,255,255,' + (1 - r.t).toFixed(3) + ')';
      ctx.lineWidth = 0.5 + 3 * (1 - r.t);
      ctx.strokeRect(r.x - r.w / 2 - e, -(r.y + BH) - e, r.w + e * 2, BH + e * 2);
    }

    // particles
    if (parts.length) {
      ctx.globalCompositeOperation = 'lighter';
      for (const p of parts) {
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.6));
        ctx.fillStyle = 'hsl(' + mod(p.h) + ',95%,72%)';
        ctx.fillRect(p.x - p.s / 2, -p.y - p.s / 2, p.s, p.s);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    // floating PERFECT text
    for (const t of texts) {
      const u = t.t / 0.95;
      const y = t.y + 46 * easeOut(Math.min(1, u * 1.2));
      const pop = 1 + 0.4 * Math.max(0, 1 - t.t / 0.14);
      const fs = Math.max(16, Math.min(26, BH * 0.8));
      ctx.save();
      ctx.translate(t.x, -y);
      ctx.scale(pop, pop);
      ctx.globalAlpha = Math.max(0, 1 - u * u);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.shadowColor = 'hsl(' + mod(t.h) + ',95%,60%)';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#fff';
      ctx.font = '800 ' + fs + 'px Unbounded, system-ui, sans-serif';
      ctx.fillText(t.main, 0, 0);
      if (t.sub) {
        ctx.font = '700 ' + Math.round(fs * 0.7) + 'px Unbounded, system-ui, sans-serif';
        ctx.fillStyle = 'hsl(' + mod(t.h) + ',100%,85%)';
        ctx.fillText(t.sub, 0, -fs * 1.05);
      }
      ctx.restore();
    }

    if (screenFlash > 0) {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.fillStyle = 'rgba(255,90,90,' + (screenFlash * 0.5).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, Math.max(0, (t - last) / 1000));
    last = t;
    if (state === 'playing') advanceSlider(t);
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  reset();
  setState('ready');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
